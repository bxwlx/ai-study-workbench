<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI 学习工作台</title>
<style>
/* ============ 设计令牌（报告 v2 设计规范） ============ */
:root{
  --primary:#4A6CF7; --primary-light:#6B8AFD; --primary-deep:#3B56D4;
  --bg:#F7F8FA; --card:#FFFFFF;
  --text:#1F2329; --text-2:#646A73; --text-3:#9CA0A8;
  --ok:#10B981; --warn:#F59E0B; --danger:#EF4444;
  --line:#EBEDF0; --radius:14px; --radius-s:10px;
  --shadow:0 1px 2px rgba(31,35,41,.04),0 4px 16px rgba(31,35,41,.05);
  --shadow-lift:0 6px 24px rgba(74,108,247,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.6;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;outline:none}
a{color:var(--primary);text-decoration:none}

/* ============ 布局：左侧栏 + 内容区 ============ */
.layout{display:flex;min-height:100vh}
.sidebar{
  width:216px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:18px 12px;
  position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-logo{
  width:38px;height:38px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.brand-name{font-size:15px;font-weight:600;line-height:1.3}
.brand-sub{font-size:11px;color:var(--text-3)}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-s);
  color:var(--text-2);font-size:14px;margin-bottom:2px;transition:background .15s,color .15s;
}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-item:hover{background:#F3F5F9}
.nav-item.active{background:#EEF1FE;color:var(--primary);font-weight:500}
.side-foot{margin-top:auto;font-size:11px;color:var(--text-3);line-height:1.7;padding:10px 8px 0;border-top:1px solid var(--line)}

.main{flex:1;min-width:0;padding:22px 26px 40px;max-width:980px;margin:0 auto;width:100%}
.view{animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 移动端底部 Tab */
.tabbar{display:none}

/* ============ 通用组件 ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:18px 20px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px}
.sec-head:first-child{margin-top:0}
.sec-title{font-size:16px;font-weight:600}
.sec-desc{font-size:12px;color:var(--text-3);margin-top:2px}
.btn-ghost{
  border:1px solid var(--primary);color:var(--primary);padding:6px 14px;border-radius:9px;
  font-size:13px;transition:all .15s;background:#fff;
}
.btn-ghost:hover{background:var(--primary);color:#fff}
.btn-solid{background:var(--primary);color:#fff;padding:8px 16px;border-radius:9px;font-size:13px;transition:background .15s}
.btn-solid:hover{background:var(--primary-deep)}
.btn-danger{background:#FEECEC;color:var(--danger);padding:8px 16px;border-radius:9px;font-size:13px}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:8px}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.search{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 14px;
  margin-bottom:14px;background:#fff;color:var(--text);transition:border-color .15s;
}
.search:focus{border-color:var(--primary-light)}
.search::placeholder{color:var(--text-3)}
/* AI 设置输入 */
.ai-input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 11px;margin-top:6px;background:#fff;color:var(--text);font-size:14px;transition:border-color .15s}
.ai-input:focus{border-color:var(--primary-light)}
textarea.ai-input{resize:vertical;line-height:1.6;font-size:13px}
/* AI 对话气泡 */
.chat-foot{display:flex;gap:10px}
.chat-foot input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:16px;background:#fff}
.chat-msg{display:flex;margin-bottom:10px}
.chat-msg.me{justify-content:flex-end}
.chat-bubble{max-width:86%;padding:10px 14px;border-radius:13px;font-size:13.5px;line-height:1.7;word-break:break-word;white-space:normal}
.chat-msg.me .chat-bubble{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border-bottom-right-radius:4px}
.chat-msg.ai .chat-bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;color:var(--text)}
.chip{
  padding:6px 14px;border-radius:999px;font-size:13px;background:#fff;color:var(--text-2);
  border:1px solid var(--line);transition:all .15s;
}
.chip:hover{border-color:var(--primary-light);color:var(--primary)}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}

.tag{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:500}
.tag-blue{background:#EEF1FE;color:var(--primary)}
.tag-green{background:#E7F8F1;color:#0B9A70}
.tag-orange{background:#FEF4E5;color:#C77F06}
.tag-gray{background:#F3F4F6;color:var(--text-2)}
.tag-red{background:#FDECEC;color:var(--danger)}

.badge-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}

/* Hero */
.hero{
  border-radius:16px;padding:26px 26px 24px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(120deg,var(--primary-deep) 0%,var(--primary) 55%,var(--primary-light) 100%);
}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero::before{content:"";position:absolute;right:70px;bottom:-90px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero-badge{
  display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
  padding:3px 12px;border-radius:999px;font-size:12px;margin-bottom:12px;position:relative;z-index:1;
}
.hero h1{font-size:24px;font-weight:600;position:relative;z-index:1}
.hero p{font-size:13px;opacity:.88;margin-top:6px;position:relative;z-index:1}

/* 统计卡 */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 8px 12px;text-align:center;box-shadow:var(--shadow)}
.stat-num{font-size:26px;font-weight:600;line-height:1.2}
.stat-label{font-size:12px;color:var(--text-3);margin-top:2px}
.stat-bar{height:3px;border-radius:2px;width:44px;margin:8px auto 0}
.bar-blue{background:linear-gradient(90deg,var(--primary),var(--primary-light))}
.bar-yellow{background:linear-gradient(90deg,#F59E0B,#FBBF24)}
.bar-green{background:linear-gradient(90deg,#10B981,#34D399)}
.bar-purple{background:linear-gradient(90deg,#8B5CF6,#A78BFA)}

/* 列表卡（图标方块 + 标题 + 徽章 + 副标题 + 箭头） */
.list-card{
  display:flex;align-items:center;gap:14px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;
  box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s;cursor:pointer;
}
.list-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.lc-icon{
  width:42px;height:42px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;
}
.lc-icon.gray{background:linear-gradient(135deg,#B9C0CC,#98A1B0)}
.lc-icon.green{background:linear-gradient(135deg,#10B981,#34D399)}
.lc-body{flex:1;min-width:0}
.lc-title{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lc-title .st{font-size:11px;color:var(--text-3);font-weight:400}
.lc-desc{font-size:12.5px;color:var(--text-2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc-arrow{
  width:30px;height:30px;border-radius:50%;background:#F3F5F9;color:var(--text-2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;
}
.list-card:hover .lc-arrow{background:var(--primary);color:#fff}
.lc-right{display:flex;align-items:center;gap:10px;flex-shrink:0}

/* 四段进度条 */
.seg-bar{display:flex;gap:6px;margin:14px 0 8px}
.seg{
  flex:1;border-radius:10px;padding:10px 6px;text-align:center;border:1.5px solid var(--line);
  background:#FAFBFC;transition:all .2s;position:relative;
}
.seg .seg-t{font-size:12.5px;font-weight:600;color:var(--text-2)}
.seg .seg-m{font-size:11px;color:var(--text-3);margin-top:1px}
.seg.done{background:linear-gradient(135deg,var(--primary),var(--primary-light));border-color:var(--primary)}
.seg.done .seg-t,.seg.done .seg-m{color:#fff}
.seg:not(.done):hover{border-color:var(--primary-light)}
.remain{font-size:12.5px;color:var(--text-2)}
.remain b{color:var(--primary)}

/* 今日任务卡 */
.task-card{border-left:4px solid var(--primary)}
.task-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.task-title{font-size:18px;font-weight:600}
.task-goal{font-size:13px;color:var(--text-2);margin-top:4px}

/* 提示条 */
.alert{display:flex;align-items:center;gap:10px;border-radius:var(--radius-s);padding:11px 14px;font-size:13px;margin-bottom:12px}
.alert-warn{background:#FEF7E8;border:1px solid #F5D48F;color:#8A6116}
.alert-red{background:#FDEEEE;border:1px solid #F3B8B8;color:#9C2B2B}
.alert-info{background:#EEF3FE;border:1px solid #C4D2FB;color:#3350B8}

/* 手册网格 */
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

/* 行式条目（我的页） */
.row-item{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);gap:12px}
.row-item:last-child{border-bottom:none}
.row-title{font-size:14px;font-weight:500}
.row-desc{font-size:12px;color:var(--text-3);margin-top:2px}

/* 抽屉 */
.drawer-mask{position:fixed;inset:0;background:rgba(31,35,41,.4);z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.drawer-mask.show{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(480px,92vw);background:var(--card);z-index:61;
  transform:translateX(102%);transition:transform .26s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(31,35,41,.12);
}
.drawer.show{transform:none}
.drawer-head{padding:18px 22px 12px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.drawer-body{flex:1;overflow-y:auto;padding:18px 22px}
.drawer-foot{padding:12px 22px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}
.dh-title{font-size:17px;font-weight:600;line-height:1.4}
.dh-tags{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.d-close{width:32px;height:32px;border-radius:50%;background:#F3F5F9;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.d-h{font-size:13.5px;font-weight:600;margin:16px 0 6px}
.d-p{font-size:13.5px;color:var(--text-2);line-height:1.75}
.d-p b{color:var(--text)}
/* Markdown 正文阅读排版 */
.md-body{font-size:14px;line-height:1.8;color:var(--text);word-break:break-word}
.md-body h1,.md-body h2,.md-body h3,.md-body h4{font-weight:600;margin:20px 0 8px;line-height:1.4}
.md-body h1{font-size:19px}
.md-body h2{font-size:16.5px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.md-body h3{font-size:15px}
.md-body h4{font-size:14px;color:var(--text-2)}
.md-body p{margin:9px 0;color:var(--text-2)}
.md-body ul{margin:8px 0 8px 2px;padding-left:18px;list-style:disc}
.md-body li{margin:4px 0;color:var(--text-2)}
.md-body code{background:#F3F5F9;padding:1px 6px;border-radius:5px;font-size:12.5px;color:var(--primary-deep)}
.md-body pre{background:#F7F8FA;border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;margin:10px 0}
.md-body pre code{background:none;padding:0;color:var(--text);font-size:12.5px}
.md-body blockquote{border-left:3px solid var(--primary-light);padding:2px 0 2px 12px;margin:10px 0;color:var(--text-2);background:#FAFBFC}
.md-body table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.md-body th,.md-body td{border:1px solid var(--line);padding:7px 10px;text-align:left}
.md-body th{background:#F7F8FA;font-weight:600}
.md-body a{color:var(--primary)}
.md-body hr{border:none;border-top:1px solid var(--line);margin:16px 0}
.quiz-item{background:#FAFBFC;border:1px solid var(--line);border-radius:10px;padding:10px 13px;margin-bottom:8px}
.quiz-q{font-size:13px;font-weight:500;display:flex;justify-content:space-between;gap:8px;align-items:flex-start;cursor:pointer}
.quiz-a{font-size:12.5px;color:var(--ok);margin-top:6px;display:none}
.quiz-item.open .quiz-a{display:block}
.tips-li{font-size:13px;color:var(--text-2);padding:5px 0 5px 16px;position:relative}
.tips-li::before{content:"";position:absolute;left:2px;top:13px;width:6px;height:6px;border-radius:50%;background:var(--primary-light)}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(31,35,41,.45);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.modal-mask.show{display:flex}
.modal{background:var(--card);border-radius:16px;padding:24px;width:min(380px,92vw);box-shadow:0 20px 60px rgba(31,35,41,.2)}
.modal h3{font-size:16px;font-weight:600;margin-bottom:8px}
.modal p{font-size:13px;color:var(--text-2);margin-bottom:18px}
.modal-btns{display:flex;gap:10px;justify-content:flex-end}
.modal input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:16px}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);
  background:rgba(31,35,41,.92);color:#fff;font-size:13px;padding:10px 20px;border-radius:10px;
  z-index:99;opacity:0;transition:all .25s;pointer-events:none;max-width:86vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 星标 */
.fav-btn{color:#C6CBD4;transition:color .15s;padding:4px}
.fav-btn svg{width:17px;height:17px;display:block}
.fav-btn.on{color:#F5B301}
.fav-btn:hover{color:#F5B301}

/* 空态 */
.empty{text-align:center;padding:42px 20px;color:var(--text-3)}
.empty .e-icon{width:52px;height:52px;border-radius:14px;background:#F3F5F9;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:#B9C0CC}
.empty .e-t{font-size:14px;color:var(--text-2)}
.empty .e-d{font-size:12px;margin-top:4px}
.empty .btn-ghost{margin-top:14px;display:inline-block}

/* 步骤条（学习页） */
.step-strip{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.step-cell{
  flex:1;min-width:86px;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:9px 6px;text-align:center;font-size:12px;color:var(--text-2);
}
.step-cell .sc-code{font-weight:600;color:var(--text);font-size:12.5px}
.step-cell.done{background:#E7F8F1;border-color:#B5EAD5}
.step-cell.done .sc-code{color:#0B9A70}
.step-cell.doing{background:#EEF1FE;border-color:var(--primary-light)}
.step-cell.doing .sc-code{color:var(--primary)}

/* ============ 响应式 ============ */
@media (max-width:768px){
  .sidebar{display:none}
  .main{padding:16px 14px calc(76px + env(safe-area-inset-bottom))}
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .grid-2{grid-template-columns:1fr}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:var(--card);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--text-3);padding:4px 0;min-height:44px;justify-content:center}
  .tab-item svg{width:20px;height:20px}
  .tab-item.active{color:var(--primary);font-weight:500}
  .hero{padding:20px 18px}
  .hero h1{font-size:20px}
}
</style>
</head>
<body>

<div class="layout">
  <!-- ============ 左侧栏（PC） ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 5.2 5.6.6-4.2 3.9 1.2 5.6L12 14.9 7 17.3l1.2-5.6L4 7.8l5.6-.6z"/></svg>
      </div>
      <div>
        <div class="brand-name" id="brandName">AI 学习工作台</div>
        <div class="brand-sub" id="brandSub">学 AI · 用 AI</div>
      </div>
    </div>
    <div id="nav"></div>
    <div class="side-foot">数据保存在本机浏览器<br>建议定期导出备份</div>
  </aside>

  <!-- ============ 内容区 ============ -->
  <main class="main"><div id="view" class="view"></div></main>
</div>

<!-- ============ 移动端底部 Tab ============ -->
<nav class="tabbar" id="tabbar"></nav>

<!-- 抽屉 -->
<div class="drawer-mask" id="drawerMask" data-action="drawer-close"></div>
<div class="drawer" id="drawer"></div>

<!-- 确认弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <p id="modalDesc"></p>
    <div class="modal-btns" id="modalBtns"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// 示例内容包（AI 学习通用版）：与 index.html 同目录即可直接体验。
// 换领域只改本文件：theme / modules / daily / manuals / prompts / glossary / tutorials / platforms。
// file 留空 = 对应按钮自动隐藏。

window.__WB_CONTENT__ = {
  "app": "ai-study-workbench-example",
  "version": 1,
  "updatedAt": "2026-09-03",

  "theme": {
    "appName": "AI 学习工作台",
    "slogan": "学 AI · 用 AI",
    "greeting": "你好，AI 学习者",
    "greetingSub": "今天也来推进一点：走完 60 分钟四段，读一篇内容，把产出记下来。",
    "stageNames": ["入门"],
    "contentLabel": "专栏",
    "unitMinutes": 60,
    "templates": 0,
    "quickLinks": []
  },

  "profile": { "stage": 1, "stageDay": 1, "streak": 0, "dailyMinutes": 60 },

  // ---------- 模块（阶段一 1.0-1.8，AI 技能入门通用路径） ----------
  "modules": [
    {
      id: "m10", code: "1.0", stage: 1, name: "术语急救包",
      goal: "一张自己的 AI 术语表",
      learn: "主流模型有哪些、各适合什么；Token 与计费；幻觉高发区；API Key 安全；上下文窗口",
      practice: "挑 2 个不同模型，用同一问题各问一遍，记差异；问 AI「我这段话多少 token」估成本",

<script>
/* ================================================================
   AI 学习工作台 · 主逻辑
   规范：渲染函数禁止互调；统一 route() 调度；事件委托 + data-action；
        所有插值经 esc() 转义；外链 target=_blank rel=noopener
   ================================================================ */
(function(){
"use strict";

/* ---------- S7 兜底：content.js 加载失败（file:// 被企业策略拦截等场景） ---------- */
if (!window.__WB_CONTENT__) {
  document.getElementById("view").innerHTML =
    '<div class="card empty" style="margin-top:40px">'
    + '<div class="e-t" style="font-weight:600;color:var(--danger)">内容包 content.js 加载失败</div>'
    + '<div class="e-d" style="margin-top:10px;line-height:2">'
    + '请确认 content.js 与本页面在同一文件夹。<br>'
    + '若是双击打开（file://）且内容仍不显示，可能是浏览器/企业策略拦截了本地子资源，<br>'
    + '此时请改用本地静态服务器打开（例如在资料库目录运行 <b>python -m http.server</b> 后访问 localhost 端口）。'
    + '</div></div>';
  return;
}

/* ---------- 常量与状态 ---------- */
var SEG_DEFS = [
  { key:"learn",    name:"学", minutes:15 },
  { key:"practice", name:"练", minutes:20 },
  { key:"record",   name:"记", minutes:15 },
  { key:"test",     name:"测", minutes:10 }
];
var BASE_TEMPLATES = tm("templates", 2); // 首页「已沉淀模板」统计基线（08-模板库 文件数，可换领域调整）

var LS = {
  progress:"wb_ai_progress", read:"wb_ai_read", fav:"wb_ai_fav",
  checkin:"wb_ai_checkin", seg:"wb_ai_daily_seg", root:"wb_ai_root",
  custom:"wb_ai_custom", stage:"wb_ai_stage", stageDay:"wb_ai_stageDay",
  ai:"wb_ai_ai", sysPrompt:"wb_ai_sysprompt"
};

/* AI 学习教练：默认系统提示词（设置页可编辑）。约束来自资料库硬约定：给依据、不编造、控长度 */
var DEFAULT_SYS_PROMPT = [
"你是「AI 学习工作台」的学习教练。",
"规则：",
"1) 优先基于下面「资料上下文」回答；上下文里没有的内容，先说『资料里没有，以下是通用知识』再回答。",
"2) 关键事实必须给出依据或来源；不确定就直接说不确定，禁止编造任何数字、链接、版本号。",
"3) 回答控制在 400 字以内，口语化，一次只讲清楚一件事。",
"4) 用户当前学习模块：{module}",
"",
"资料上下文：",
"{context}"
].join("\n");

/* AI 配置默认值：DeepSeek 开箱即用（用户只需填自己的 Key） */
var DEFAULT_AI = { base:"https://api.deepseek.com/v1", key:"", model:"deepseek-chat", temp:0.7 };

var C = window.__WB_CONTENT__ || { modules:[], daily:[], manuals:[], prompts:[], glossary:[], tutorials:[], platforms:[], profile:{} };

/* 主题读取层（开源化）：换领域只需改 content.theme；缺省回退 AI 学习版默认文案 */
var TH = C.theme || {};
function tm(k, def){ return TH[k] != null ? TH[k] : def; }
var CL = tm("contentLabel", "专栏");   // 每日内容的叫法（AI 版叫「专栏」，换领域可改「文章/卡片」等）

function lsGet(k, def){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ toast("存储失败：" + e.message); } }

var state = {
  route: "home",
  manualCat: "全部",
  toolCat: "全部",
  learnStage: lsGet(LS.stage, 1),
  progress: lsGet(LS.progress, null) || (function(){
    var p = {}; (C.modules||[]).forEach(function(m){ p[m.id] = m.status || "todo"; }); return p;
  })(),
  read: lsGet(LS.read, []),
  fav: lsGet(LS.fav, { platforms:[], tutorials:[] }),
  checkin: lsGet(LS.checkin, []),
  seg: lsGet(LS.seg, {}),
  custom: lsGet(LS.custom, { platforms:[], tutorials:[] }),
  stageDay: lsGet(LS.stageDay, (window.__WB_CONTENT__.profile||{}).stageDay||1),
  ai: lsGet(LS.ai, DEFAULT_AI),
  sysPrompt: lsGet(LS.sysPrompt, DEFAULT_SYS_PROMPT),
  chat: [],          // 对话仅存内存，不落盘
  drawer: null
};

function save(k){ lsSet(k, state[k.key || k]); }
function saveAll(){
  lsSet(LS.progress, state.progress); lsSet(LS.read, state.read);
  lsSet(LS.fav, state.fav); lsSet(LS.checkin, state.checkin);
  lsSet(LS.seg, state.seg); lsSet(LS.custom, state.custom); lsSet(LS.stage, state.learnStage);
}

/* ---------- 工具函数 ---------- */
function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function todayStr(){
  var d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function yesterdayStr(){
  var d = new Date(); d.setDate(d.getDate()-1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
/* 报告 4.3 指定的 todayDaily —— 按日期匹配，断档回退最近一篇 */
function todayDaily(){
  var t = todayStr(), list = C.daily || [];
  for (var i=0;i<list.length;i++){ if(list[i].date === t) return list[i]; }
  var past = list.filter(function(d){ return d.date <= t; });
  return past.length ? past[past.length-1] : (list[0] || null);
}
/* 运行模式：file:// 打开 = 本机模式（直跳资料库）；公网/APK = 应用模式（读随网页部署的镜像） */
var APP_MODE = location.protocol !== "file:";
function rootBase(){
  if (APP_MODE) return "content/";   // 部署目录内的资料镜像
  var saved = localStorage.getItem(LS.root);
  // 本机模式资料库根目录：优先用户设置；content.js 可提供 WB_ROOT；都没有则为空（file 类按钮自动隐藏）
  return saved ? saved.replace(/["\s]/g,"") : (window.WB_ROOT || "");
}
function wbPath(rel){ return rel ? (rootBase() + rel) : ""; }
function moduleByCode(code){ return (C.modules||[]).filter(function(m){ return m.code===code; })[0]; }
function currentModule(){
  var doing = (C.modules||[]).filter(function(m){ return state.progress[m.id]==="doing"; });
  if (doing.length) return doing[0];
  var todo = (C.modules||[]).filter(function(m){ return !state.progress[m.id] || state.progress[m.id]==="todo"; });
  return todo.length ? todo[0] : (C.modules||[])[0];
}
function calcStreak(){
  var set = {}; state.checkin.forEach(function(d){ set[d]=1; });
  var n = 0, d = new Date();
  // 今天未打卡时，从昨天起算
  if(!set[todayStr()]) d.setDate(d.getDate()-1);
  for(;;){
    var k = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if(set[k]){ n++; d.setDate(d.getDate()-1); } else break;
  }
  return n;
}
function stats(){
  var done = (C.modules||[]).filter(function(m){ return state.progress[m.id]==="done"; }).length;
  var minutes = 0; state.read.forEach(function(id){
    var d = (C.daily||[]).filter(function(x){ return x.id===id; })[0];
    if(d) minutes += (d.minutes||15);
  });
  var segToday = state.seg[todayStr()] || {};
  var segCount = SEG_DEFS.filter(function(s){ return segToday[s.key]; }).length;
  var favCount = state.fav.platforms.length + state.fav.tutorials.length;
  return {
    streak: calcStreak(),
    doneModules: done,
    hours: Math.round(minutes/6)/10,
    templates: BASE_TEMPLATES + state.custom.platforms.length + state.custom.tutorials.length,
    segCount: segCount, favCount: favCount,
    checkedIn: state.checkin.indexOf(todayStr()) >= 0
  };
}
function unreadBacklog(){
  // 今天及更早、未读的专栏 = 顺延待办
  var t = todayStr();
  return (C.daily||[]).filter(function(d){
    return d.date <= t && state.read.indexOf(d.id) < 0;
  });
}
function dailyRemain(){
  var t = todayStr();
  return (C.daily||[]).filter(function(d){ return d.date >= t; }).length;
}
function allPlatforms(){ return (C.platforms||[]).concat(state.custom.platforms); }
function allTutorials(){ return (C.tutorials||[]).concat(state.custom.tutorials); }

var ICONS = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>',
  learn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 19a2 2 0 002 2h13"/></svg>',
  manual:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.5 5 8.4 4.5 6 4.5c-1 0-2 .1-3 .4v13.6c1-.3 2-.4 3-.4 2.4 0 4.5.5 6 2 1.5-1.5 3.6-2 6-2 1 0 2 .1 3 .4V4.9c-1-.3-2-.4-3-.4-2.4 0-4.5.5-6 2z"/><path d="M12 6.5v13.6"/></svg>',
  tools:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4.5 4.5 0 00-6 6L3 18l3 3 5.7-5.7a4.5 4.5 0 006-6L14.5 12l-2.5-2.5z"/></svg>',
  mine:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.8l2.8 5.8 6.2.9-4.5 4.4 1 6.3-5.5-3-5.5 3 1-6.3L3 9.5l6.2-.9z"/></svg>',
  x:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

var NAVS = [
  { key:"home",   name:"今日", icon:ICONS.home },
  { key:"learn",  name:"学习", icon:ICONS.learn },
  { key:"manual", name:"手册", icon:ICONS.manual },
  { key:"tools",  name:"工具", icon:ICONS.tools },
  { key:"mine",   name:"我的", icon:ICONS.mine }
];

/* ---------- 静态框架（导航，一次性渲染） ---------- */
function renderNav(){
  document.getElementById("nav").innerHTML = NAVS.map(function(n){
    return '<div class="nav-item'+(state.route===n.key?" active":"")+'" data-action="nav" data-route="'+n.key+'">'
      + n.icon + '<span>'+n.name+'</span></div>';
  }).join("");
  document.getElementById("tabbar").innerHTML = NAVS.map(function(n){
    return '<div class="tab-item'+(state.route===n.key?" active":"")+'" data-action="nav" data-route="'+n.key+'">'
      + n.icon + '<span>'+n.name+'</span></div>';
  }).join("");
}

/* ---------- 首页 ---------- */
function renderHome(){
  var m = currentModule();
  var st = stats();
  var segToday = state.seg[todayStr()] || {};
  var td = todayDaily();
  var backlog = unreadBacklog();
  var remainMin = SEG_DEFS.reduce(function(s,d){ return s + (segToday[d.key]?0:d.minutes); },0);

  var html = '';

  // Hero（复刻参考：渐变 + 徽章 + 问候）
  html += '<div class="hero">'
    + '<div class="hero-badge">' + todayStr() + ' · ' + esc(tm("badgeLabel","今日 · 第 ") + (state.stageDay||1)) + ' 期 · 内容已更新 ' + (C.daily||[]).length + ' 篇</div>'
    + '<h1>' + esc(tm("greeting","你好，学习者")) + '</h1>'
    + '<p>' + esc(tm("greetingSub","今天也来推进一点：完成今天的单元，读一篇内容，把产出记下来。")) + '</p>'
    + '</div>';

  // 今日任务卡
  html += '<div class="sec-head"><div><div class="sec-title">今日任务</div>'
    + '<div class="sec-desc">按「学15 → 练20 → 记15 → 测10」走完一个单元</div></div>'
    + '<button class="btn-ghost" data-action="goto" data-route="learn">进入学习</button></div>';
  if (m) {
    html += '<div class="card pad task-card">'
      + '<div class="task-meta"><span class="tag tag-blue">模块 ' + esc(m.code) + '</span>'
      + '<span class="tag '+(st.checkedIn?"tag-green":"tag-orange")+'">'+(st.checkedIn?"今日已打卡":"今日待打卡")+'</span>'
      + '<span class="tag tag-gray">熟练度 ' + esc(m.level||"L1") + '</span></div>'
      + '<div class="task-title">' + esc(m.name) + '</div>'
      + '<div class="task-goal">目标产出：' + esc(m.goal) + '</div>'
      + '<div class="seg-bar">' + SEG_DEFS.map(function(d){
          var on = !!segToday[d.key];
          return '<div class="seg'+(on?" done":"")+'" data-action="seg-toggle" data-seg="'+d.key+'" role="button">'
            + '<div class="seg-t">'+(on?"✓ ":"")+esc(d.name)+' '+d.minutes+"'</div>"
            + '<div class="seg-m">'+(on?"已完成":"未完成")+'</div></div>';
        }).join('') + '</div>'
      + '<div class="remain">'+(st.checkedIn
          ? '今日四段已全部完成，打卡成功。明天继续下一个单元。'
          : '剩余 <b>'+remainMin+'</b> 分钟 · 点击上方四段进行勾选')+'</div>'
      + '</div>';
  }

  // 今天要处理（顺延）
  html += '<div class="sec-head"><div><div class="sec-title">今天要处理</div>'
    + '<div class="sec-desc">昨日未完成的会顺延到这里，别攒太多</div></div></div>';
  if (backlog.length) {
    html += '<div class="alert alert-red"><span class="badge-dot" style="background:var(--danger)"></span>'
      + '有 <b>' + backlog.length + '</b> 篇' + CL + '还没读' + (backlog.length>1 && backlog[0].date!==todayStr() ? '，最早的一篇是 ' + backlog[0].date : '') + '。</div>';
    html += backlog.slice(0,3).map(function(d){
      var isToday = d.date===todayStr();
      return '<div class="list-card" data-action="open-daily" data-id="'+esc(d.id)+'">'
        + '<div class="lc-icon'+(isToday?"":" gray")+'">'+esc((moduleByCode(d.moduleCode)||{}).code||CL)+'</div>'
        + '<div class="lc-body"><div class="lc-title">'+esc(d.title)
        + '<span class="tag'+(isToday?" tag-blue":" tag-red")+'">'+(isToday?"今日":"顺延")+'</span></div>'
        + '<div class="lc-desc">'+esc(d.date)+' · '+d.minutes+' 分钟 · '+esc(d.source)+'</div></div>'
        + '<div class="lc-arrow">'+ICONS.arrow+'</div></div>';
    }).join('');
    if (backlog.length>3) html += '<div class="sec-desc" style="margin:4px 2px 0">还有 '+(backlog.length-3)+' 篇，去「学习」页查看全部。</div>';
  } else {
    html += '<div class="card pad" style="text-align:center;color:var(--ok);font-size:13.5px">全部清完，没有顺延事项。</div>';
  }

  // 统计
  html += '<div class="sec-head"><div><div class="sec-title">学习统计</div></div>'
    + '<button class="btn-ghost" data-action="goto" data-route="mine">查看我的</button></div>'
    + '<div class="stat-row">'
    + statCard(st.streak,"连续打卡","bar-blue")
    + statCard(st.doneModules+" / "+(C.modules||[]).length,"已完成模块","bar-green")
    + statCard(st.hours,"累计学时","bar-yellow")
    + statCard(st.templates,"已沉淀模板","bar-purple")
    + '</div>';

  // 快捷入口（来自主题配置，无配置则不显示）
  var homeQl = tm("quickLinks", []);
  if (homeQl.length){
    html += '<div class="sec-head"><div><div class="sec-title">快捷入口</div></div></div>' + quickLinksHtml(homeQl);
  }

  // 备份区（与「我的」复用同一逻辑）
  html += '<div class="sec-head"><div><div class="sec-title">数据备份</div>'
    + '<div class="sec-desc">数据只存在本机浏览器，清缓存会丢，定期导出</div></div></div>'
    + backupHtml();

  // 余量预警
  var rm = dailyRemain();
  if (rm < 7) {
    html += '<div style="height:14px"></div><div class="alert alert-warn">'
      + CL+'余量仅 <b>'+rm+'</b> 天（建议 ≥7 天）'
      + '<button class="btn-ghost btn-sm" style="margin-left:auto" data-action="copy-topic-prompt">复制选题提示词</button></div>';
  }

  return html;
}
function statCard(num,label,bar){
  return '<div class="stat-card"><div class="stat-num">'+num+'</div><div class="stat-label">'+label+'</div><div class="stat-bar '+bar+'"></div></div>';
}
function rowItem(title,desc,right){
  return '<div class="row-item"><div><div class="row-title">'+title+'</div><div class="row-desc">'+esc(desc)+'</div></div>'+right+'</div>';
}
/* 快捷入口：入口列表来自 theme，可随主题包自定义 */
function quickLinksHtml(list){
  if (!list || !list.length) return '';
  return '<div class="card pad">' + list.map(function(q){
    var pre = q.hint ? '<span class="tag tag-orange" style="margin-right:6px">' + esc(q.hint) + '</span>' : '';
    var btn = (q.act === "copy")
      ? '<button class="btn-solid btn-sm" data-action="copy-daily-template">复制模板</button>'
      : '<button class="btn-ghost btn-sm" data-action="open-file" data-file="' + esc(q.file || "") + '">打开</button>';
    return '<div class="row-item"><div><div class="row-title">' + pre + esc(q.name) + '</div>'
      + '<div class="row-desc">' + esc(q.desc || "") + '</div></div>' + btn + '</div>';
  }).join('') + '</div>';
}
function backupHtml(){
  return '<div class="card pad">'
    + rowItem("导出 JSON 快照","下载全部学习数据，换设备时可导入恢复",'<button class="btn-solid btn-sm" data-action="export-data">导出</button>')
    + rowItem("导入恢复数据","选择之前导出的 JSON 文件，将覆盖当前数据",'<label class="btn-ghost btn-sm" style="cursor:pointer">导入<input type="file" accept=".json,application/json" style="display:none" data-action="import-file"></label>')
    + rowItem("清空本机数据","删除全部进度/打卡/收藏，课程内容保留",'<button class="btn-danger btn-sm" data-action="clear-data">清空</button>')
    + '</div>';
}

/* ---------- 学习页 ---------- */
function renderLearn(){
  // 阶段集合从 modules 动态聚合（骨架不再假定固定期数）
  var stageIds = [];
  (C.modules||[]).forEach(function(m){ if (stageIds.indexOf(m.stage) < 0) stageIds.push(m.stage); });
  stageIds.sort(function(a,b){ return a-b; });
  if (stageIds.length && stageIds.indexOf(state.learnStage) < 0) state.learnStage = stageIds[0];
  var stageNames = tm("stageNames", ["一","二","三","四"]);
  var html = '<div class="sec-head"><div><div class="sec-title">学习</div>'
    + '<div class="sec-desc">按阶段推进 · 每个模块内循环「学练记测」</div></div></div>'
    + '<div class="chips">' + stageIds.map(function(s){
      var nm = stageNames[s-1] || ("第"+s+"期");
      return '<div class="chip'+(state.learnStage===s?" active":"")+'" data-action="stage" data-stage="'+s+'">' + s + ' · ' + esc(nm) + '</div>';
    }).join('') + '</div>'
    + '<input class="search" id="learnSearch" placeholder="搜索模块 / ' + CL + '…" value="'+esc(state.learnQ||"")+'">'
    + '<div id="learnList">'+learnBodyHtml(state.learnQ||"")+'</div>';
  return html;
}
function learnBodyHtml(q){
  q = (q||"").trim().toLowerCase();
  var mods = (C.modules||[]).filter(function(m){ return m.stage===state.learnStage; });
  var fMods = q ? mods.filter(function(m){ return (m.name+" "+m.code+" "+m.goal).toLowerCase().indexOf(q)>=0; }) : mods;
  var html = '';
  if (!mods.length) {
    return '<div class="card empty"><div class="e-icon">'+ICONS.learn+'</div>'
      + '<div class="e-t">本期内容尚未配置</div>'
      + '<div class="e-d">在 content.js 的 modules 中添加该阶段的模块，或查看仓库的主题包说明</div>'
      + '<button class="btn-ghost" data-action="goto" data-route="manual">去手册页看看</button></div>';
  }
  // 步骤条（不受搜索影响）
  html += '<div class="step-strip">' + mods.map(function(m){
    var s = state.progress[m.id]||"todo";
    return '<div class="step-cell '+s+'"><div class="sc-code">'+esc(m.code)+'</div>'
      + '<div>'+(s==="done"?"已完成":(s==="doing"?"进行中":"未开始"))+'</div></div>';
  }).join('') + '</div>';

  if (!fMods.length) {

/* ---------- 内置 Markdown 渲染器（应用模式阅读用，约 100 行，零依赖） ---------- */
function mdInline(s){
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function mdRow(l){ return l.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(function(s){ return s.trim(); }); }
function mdToHtml(src){
  var lines = String(src || "").split(/\r?\n/), out = [], inCode = false, buf = [], inList = false;
  function endList(){ if (inList){ out.push("</ul>"); inList = false; } }
  for (var i = 0; i < lines.length; i++){
    var ln = lines[i];
    if (/^\s*```/.test(ln)){
      if (inCode){ out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>"); buf = []; }
      inCode = !inCode; continue;
    }
    if (inCode){ buf.push(ln); continue; }
    if (/^\s*$/.test(ln)){ endList(); continue; }
    var h = ln.match(/^(#{1,6})\s+(.*)$/);
    if (h){ endList(); var lv = h[1].length; out.push("<h" + lv + ">" + mdInline(h[2]) + "</h" + lv + ">"); continue; }
    if (/^\s*[-*+]\s+/.test(ln) || /^\s*\d+[.)]\s+/.test(ln)){
      if (!inList){ out.push("<ul>"); inList = true; }
      out.push("<li>" + mdInline(ln.replace(/^\s*[-*+]\s+/, "").replace(/^\s*\d+[.)]\s+/, "")) + "</li>"); continue;
    }
    if (/^\s*>\s?/.test(ln)){ endList(); out.push("<blockquote>" + mdInline(ln.replace(/^\s*>\s?/, "")) + "</blockquote>"); continue; }
    if (/^\s*\|.*\|\s*$/.test(ln) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])){
      endList();
      var head = mdRow(ln), rows = [];
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ rows.push(mdRow(lines[i])); i++; }
      i--;
      var t = "<table><thead><tr>" + head.map(function(c){ return "<th>" + mdInline(c) + "</th>"; }).join("") + "</tr></thead><tbody>";
      rows.forEach(function(r){ t += "<tr>" + r.map(function(c){ return "<td>" + mdInline(c) + "</td>"; }).join("") + "</tr>"; });
      out.push(t + "</tbody></table>"); continue;
    }
    endList();
    out.push("<p>" + mdInline(ln) + "</p>");
  }
  endList();
  return out.join("");
}

        + '<div class="dh-tags"><span class="tag tag-blue">应用内阅读</span>'
        + '<span class="tag tag-gray">' + relEsc + '</span></div>',
    body: '<div class="md-body" id="mdBody"><div class="empty"><div class="e-t">正在读取…</div></div></div>'
  }, rel, true);
  var box = document.getElementById("mdBody");
  if (!box) return;
  if (READER_CACHE[rel]){
    box.innerHTML = mdToHtml(READER_CACHE[rel]); return;
  }
  fetch(url).then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function(t){
      READER_CACHE[rel] = t;
      box.innerHTML = mdToHtml(t);
    })
    .catch(function(e){
      box.innerHTML = '<div class="empty"><div class="e-t">读取失败：' + esc(e.message) + '</div>'
        + '<div class="e-d">路径：' + esc(url) + '</div>'
        + '<div class="e-d">若此文件未随网页部署，请到「我的」查看或改用电脑本机打开</div></div>';
    });
}

/* ---------- AI 学习教练（OpenAI 兼容：DeepSeek 默认，可切 Ollama 等） ---------- */
function aiContext(){
  var m = currentModule(), parts = [];
  if (m){
    parts.push("模块 " + m.code + " " + m.name);
    if (m.goal)   parts.push("目标产出：" + m.goal);
    if (m.learn)  parts.push("学：" + m.learn);
    if (m.accept) parts.push("验收：" + m.accept);
  }
  // 应用模式下把当前阅读文件的前 2000 字作为上下文（本机模式读不到文件，跳过）
  if (CURRENT_DRAWER_FILE && READER_CACHE[CURRENT_DRAWER_FILE]){
    parts.push("\n当前阅读文件：" + CURRENT_DRAWER_FILE + "\n" + READER_CACHE[CURRENT_DRAWER_FILE].slice(0, 2000));
  }
  return parts.join("\n") || "（暂无上下文）";
}
function aiSysRendered(){
  var m = currentModule();
  return state.sysPrompt
    .replace("{module}", m ? (m.code + " " + m.name) : "未开始")
    .replace("{context}", aiContext());
}
function aiSend(text){
  text = String(text || "").trim();
  if (!text) return;
  state.chat.push({ role:"user", content:text });
  renderAiDrawer();
  var cfg = state.ai;
  if (!cfg.key){
    state.chat.push({ role:"assistant", content:"⚠️ 还没填 API Key。到「我的 → AI 学习教练」填入你的 DeepSeek Key（Key 只存本机浏览器，不会上传，也不会写进备份文件）。" });
    renderAiDrawer(); return;
  }
  var msgs = [{ role:"system", content:aiSysRendered() }].concat(state.chat);
  var url = String(cfg.base || "").replace(/\/+$/, "") + "/chat/completions";
  fetch(url, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + cfg.key },
    body: JSON.stringify({ model: cfg.model || "deepseek-chat", temperature: Number(cfg.temp) || 0.7, messages: msgs })
  }).then(function(r){
    return r.text().then(function(t){
      if (!r.ok){
        var msg = "请求失败（HTTP " + r.status + "）";
        try { var j = JSON.parse(t); if (j && j.error && j.error.message) msg += "：" + j.error.message; } catch(e){}
        if (r.status === 401) msg += "。请检查 API Key 是否正确。";
        if (r.status === 404) msg += "。请检查 Base URL 与模型名是否匹配。";
        throw new Error(msg);
      }
      var d = JSON.parse(t);
      return (d && d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || "（模型未返回内容）";
    });
  }).then(function(reply){
    state.chat.push({ role:"assistant", content:reply });
    renderAiDrawer();
  }).catch(function(err){
    var tip = String(err.message || "").indexOf("Failed to fetch") >= 0
      ? "网络请求失败：可能是跨域限制或网络不通。云端 API 一般可直连；本地 Ollama 需启动时设置 OLLAMA_ORIGINS=*。"
      : err.message;
    state.chat.push({ role:"assistant", content:"⚠️ " + tip });
    renderAiDrawer();
  });
}
function renderAiDrawer(){
  var cfg = state.ai, body = "";
  if (!cfg.key){
    body += '<div class="alert alert-warn">未配置 API Key，当前不可对话。到「我的 → AI 学习教练」填入 DeepSeek Key 即可。</div>';
  }
  body += '<div id="chatList">' + (state.chat.length ? state.chat.map(function(m){
    return '<div class="chat-msg ' + (m.role === "user" ? "me" : "ai") + '"><div class="chat-bubble">'
      + esc(m.content).replace(/\n/g, "<br>") + '</div></div>';
  }).join("") : '<div class="empty" style="padding:26px"><div class="e-t">问点什么吧</div>'
    + '<div class="e-d">例：用大白话解释什么是 Token？/ 这个模块的验收我怎么自查？</div></div>') + '</div>';
  var d = document.getElementById("drawer");
  d.innerHTML = '<div class="drawer-head"><div><div class="dh-title">AI 学习教练</div>'
    + '<div class="dh-tags"><span class="tag tag-blue">' + esc(cfg.model || "") + '</span>'
    + '<span class="tag tag-gray">模块 ' + esc(currentModule() ? currentModule().code : "未开始") + '</span></div></div>'
    + '<button class="d-close" data-action="drawer-close">' + ICONS.x + '</button></div>'
    + '<div class="drawer-body">' + body + '</div>'
    + '<div class="drawer-foot chat-foot">'
    + '<input id="chatInput" placeholder="输入你的问题…" autocomplete="off">'
    + '<button class="btn-solid" data-action="ai-send">发送</button></div>';
  document.getElementById("drawerMask").classList.add("show");
  d.classList.add("show");
  var list = document.getElementById("chatList");
  if (list) list.scrollTop = list.scrollHeight;
}
function openAi(){
  state.chat = state.chat || [];
  renderAiDrawer();
  setTimeout(function(){ var i = document.getElementById("chatInput"); if (i) i.focus(); }, 120);
}

document.addEventListener("change", function(e){

    var fr = new FileReader();
    fr.onload = function(){
      try {
        var d = JSON.parse(fr.result);
        if (!d || (!d.progress && !d.checkin)) throw new Error("不是有效的工作台快照");
        if (d.progress) { state.progress=d.progress; lsSet(LS.progress,d.progress); }
        if (d.read) { state.read=d.read; lsSet(LS.read,d.read); }
        if (d.fav) { state.fav=d.fav; lsSet(LS.fav,d.fav); }
        if (d.checkin) { state.checkin=d.checkin; lsSet(LS.checkin,d.checkin); }
        if (d.seg) { state.seg=d.seg; lsSet(LS.seg,d.seg); }
        if (d.custom) { state.custom=d.custom; lsSet(LS.custom,d.custom); }
        if (d.root) localStorage.setItem(LS.root, String(d.root));
        toast("导入成功"); refreshAll();
      } catch(err){ toast("导入失败："+err.message); }
    };
    fr.readAsText(el.files[0]);
    el.value = "";
  }
});
document.addEventListener("keydown", function(e){

function copyText(txt, msg){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function(){ toast(msg); }, function(){ fallbackCopy(txt,msg); });
  } else fallbackCopy(txt,msg);
}
function fallbackCopy(txt,msg){
  var ta = document.createElement("textarea");
  ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast(msg); }catch(e){ toast("复制失败，请手动复制"); }
  document.body.removeChild(ta);
}

  var v = function(val){ return esc(val==null?"":val); };
  var html = '<div class="d-h" style="margin-top:0">'+(editing?("编辑："+esc(editing.name)):"新增"+(MANAGE_TAB==="pf"?"平台":"教程链接"))+'（仅本机生效）</div>'
    + '<input id="mf-name" placeholder="名称" value="'+v(editing&&editing.name)+'" style="width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:8px">'
    + '<input id="mf-cat" placeholder="分类（文生图/剪辑/编程…）" value="'+v(editing&&editing.cat)+'" style="width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:8px">'
    + (MANAGE_TAB==="pf" ? '<input id="mf-desc" placeholder="一句话介绍" value="'+v(editing&&editing.desc)+'" style="width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:8px">' : '')
    + '<input id="mf-link" placeholder="链接 https://…" value="'+v(editing&&editing.link)+'" style="width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:10px">'
    + '<button class="btn-solid btn-sm" data-action="custom-add">'+(editing?"保存修改":"添加")+'</button>'
    + (editing?'<button class="btn-ghost btn-sm" data-action="custom-cancel-edit" style="margin-left:8px">取消</button>':'')
    + '<div class="d-h">已添加 '+list.length+' 个</div>'
    + (list.length ? list.map(function(x,i){
        return '<div class="row-item"><div><div class="row-title">'+esc(x.name)+'</div><div class="row-desc">'+esc(x.cat||"")+'</div></div>'
          + '<div style="display:flex;gap:8px;flex-shrink:0">'
          + '<button class="btn-ghost btn-sm" data-action="custom-edit" data-idx="'+i+'">编辑</button>'
          + '<button class="btn-danger btn-sm" data-action="custom-del" data-idx="'+i+'">删除</button></div></div>';
      }).join('') : '<div class="d-p" style="color:var(--text-3)">还没有，正式内容请改 content.js</div>');
  document.getElementById("drawerMask").classList.add("show");
  var d = document.getElementById("drawer");
  d.innerHTML = '<div class="drawer-head"><div><div class="dh-title">内容管理</div></div>'
    + '<button class="d-close" data-action="drawer-close">'+ICONS.x+'</button></div>'
    + '<div class="drawer-body">'+html+'</div>'
    + '<div class="drawer-foot"><button class="btn-ghost" style="flex:1" data-action="drawer-close">完成</button></div>';
  d.classList.add("show");
}
document.addEventListener("click", function(e){
  var el = e.target.closest('[data-action="custom-add"],[data-action="custom-del"],[data-action="custom-edit"],[data-action="custom-cancel-edit"]');
  if (!el) return;
  var a = el.getAttribute("data-action");
  if (a==="custom-add"){
    var g = function(id){ var x=document.getElementById(id); return x?x.value.trim():""; };
    var name = g("mf-name");
    if (!name){ toast("名称必填"); return; }
    if (MANAGE_EDIT>=0){
      var it = (MANAGE_TAB==="pf"?state.custom.platforms:state.custom.tutorials)[MANAGE_EDIT];
      if (it){
        it.name = name; it.cat = g("mf-cat")||it.cat||"其他"; it.link = g("mf-link");
        if (MANAGE_TAB==="pf") it.desc = g("mf-desc");
      }
      lsSet(LS.custom, state.custom);
      toast("已保存修改"); openManageDrawer(MANAGE_TAB, -1);
    } else {
      if (MANAGE_TAB==="pf"){
        state.custom.platforms.push({ id:"c"+Date.now(), cat:g("mf-cat")||"其他", name:name,
          logo:name.slice(0,1), desc:g("mf-desc")||"", scene:"", tips:[], link:g("mf-link"), verifiedAt:todayStr(), _local:true });
      } else {
        state.custom.tutorials.push({ id:"c"+Date.now(), cat:g("mf-cat")||"其他", name:name,
          sections:"", minutes:30, outcome:"", link:g("mf-link"), _local:true });
      }
      lsSet(LS.custom, state.custom);
      toast("已添加（仅本机）"); openManageDrawer();
    }
    return;
  }
  if (a==="custom-edit"){
    openManageDrawer(MANAGE_TAB, parseInt(el.getAttribute("data-idx"),10)); return;
  }
  if (a==="custom-cancel-edit"){
    openManageDrawer(MANAGE_TAB, -1); return;
  }
  if (a==="custom-del"){
    var i = parseInt(el.getAttribute("data-idx"),10);
    if (MANAGE_TAB==="pf") state.custom.platforms.splice(i,1);
    else state.custom.tutorials.splice(i,1);
    lsSet(LS.custom, state.custom);
    toast("已删除"); openManageDrawer(MANAGE_TAB, -1); return;
  }
});

  var app = tm("appName", "AI 学习工作台");
  var bn = document.getElementById("brandName");
  if (bn && app) bn.textContent = app;
  var bs = document.getElementById("brandSub");
  if (bs && tm("slogan")) bs.textContent = tm("slogan");
  if (app) document.title = app;
})();
window.addEventListener("hashchange", route);
route();
})();
